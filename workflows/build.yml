name: Build Fabric Mod 1.21.4

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile Mod
        run: ./gradlew build

      - name: Upload mod jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fabric-Mod-1.21.4
          path: build/libs/*.jar
